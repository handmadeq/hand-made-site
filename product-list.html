<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>
</head>
<body>
    <header>
        <h1>قائمة المنتجات</h1>
        <button id="signOutButton">تسجيل الخروج</button>
    </header>

    <main>
        <section id="productsGrid">
            <!-- المنتجات ستظهر هنا -->
        </section>
    </main>

    <footer>
        <button id="addProductButton">إضافة منتج</button>
    </footer>

    <script>
        // إعداد Firebase
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "AUTH_DOMAIN",
            projectId: "PROJECT_ID",
            storageBucket: "STORAGE_BUCKET",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const productsGrid = document.getElementById('productsGrid');
        const signOutButton = document.getElementById('signOutButton');
        const addProductButton = document.getElementById('addProductButton');

        // عرض قائمة المنتجات
        function fetchProducts() {
            db.collection('products')
                .get()
                .then(snapshot => {
                    snapshot.forEach(doc => {
                        const product = doc.data();
                        const productCard = document.createElement('div');
                        productCard.classList.add('product-card');
                        productCard.innerHTML = `
                            <img src="${product.imageUrls[0]}" alt="Product Image">
                            <h2>${product.title}</h2>
                            <p>${product.description}</p>
                            <p>${product.price} ر.س</p>
                        `;
                        productsGrid.appendChild(productCard);
                    });
                })
                .catch(error => console.error("Error fetching products: ", error));
        }

        // تسجيل الخروج
        signOutButton.addEventListener('click', () => {
            auth.signOut()
                .then(() => window.location.href = 'login.html')
                .catch(error => console.error("Error signing out: ", error));
        });

        // التنقل إلى صفحة إضافة منتج
        addProductButton.addEventListener('click', () => {
            window.location.href = 'addProduct.html';
        });

        // استدعاء دالة عرض المنتجات عند تحميل الصفحة
        fetchProducts();
    </script>
</body>
</html>
